parameters:
    #parameter_name: value

services:
    #service_name:
    #    class: AppBundle\Directory\ClassName
    #    arguments: ['@another_service_name', 'plain_value', '%parameter_name%']

    registrarusuario:
        class: AppBundle\Service\RegistroService
        arguments: ["@doctrine.orm.entity_manager", "@security.password_encoder"]
    
    validaruser:
        class: AppBundle\Service\ValidarUserService
        arguments: ["@validator"]

    consultardatos:
        class: AppBundle\Service\ConsultarService
        arguments: ["@doctrine.orm.entity_manager"]

    aumentarnops:
        class: AppBundle\Service\SumarOpsService
        arguments: ["@doctrine.orm.entity_manager"]

    actualizardatos:
        class: AppBundle\Service\ActualizarService
        arguments: ["@doctrine.orm.entity_manager"]
